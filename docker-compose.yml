services:
  postgres:
    image: postgres:16-alpine
    container_name: dichtbij3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dichtbij3d}
      POSTGRES_USER: ${POSTGRES_USER:-dichtbij3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dichtbij3d}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dichtbij3d} -d ${POSTGRES_DB:-dichtbij3d}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dichtbij3d]

  minio:
    image: quay.io/minio/minio:latest
    container_name: dichtbij3d-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dichtbij3d}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dichtbij3d-secret}
    volumes:
      - miniodata:/data
    ports:
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [dichtbij3d]

  backend:
    image: ghcr.io/jordydevrix/dichtbij3d-backend:${BACKEND_TAG:-latest}
    container_name: dichtbij3d-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dichtbij3d}
      DB_USER: ${POSTGRES_USER:-dichtbij3d}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dichtbij3d}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dichtbij3d}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dichtbij3d-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-dichtbij3d}
      DICHTBIJ3D_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to 64+ random characters}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8088}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGINS: ${PUBLIC_URL:-http://localhost:8088}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dichtbij3d.nl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD for the bootstrap admin}
      DEMO_DATA: ${DEMO_DATA:-false}
      # Mail / SMTP configuration (passed from Portainer stack env)
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-${MAIL_HOST:-${SMTP_HOST:-}}}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-${MAIL_PORT:-${SMTP_PORT:-587}}}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-${MAIL_USERNAME:-${SMTP_USERNAME:-${SMTP_USER:-}}}}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-${MAIL_PASSWORD:-${SMTP_PASSWORD:-${SMTP_PASS:-}}}}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-${MAIL_SMTP_AUTH:-${SMTP_AUTH:-true}}}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-${MAIL_SMTP_STARTTLS:-${SMTP_STARTTLS:-true}}}
      MAIL_FROM: ${MAIL_FROM:-noreply@jordydevrix.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Dichtbij3D}
      FRONTEND_URL: ${FRONTEND_URL:-${PUBLIC_URL:-http://localhost:8088}}
      MAIL_RESET_TOKEN_TTL: ${MAIL_RESET_TOKEN_TTL:-PT30M}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    networks: [dichtbij3d]

  frontend:
    image: ghcr.io/jordydevrix/dichtbij3d-frontend:${FRONTEND_TAG:-latest}
    container_name: dichtbij3d-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Empty = same origin: nginx proxies /api to the backend service, so the
      # browser never needs to know the backend host and there is no CORS.
      API_URL: ${API_URL:-}
      BACKEND_URL: http://backend:8080
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    ports:
      - '${FRONTEND_PORT:-8088}:80'
    networks: [dichtbij3d, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SUBDOMAIN:-dichtbij3d-tst}.rule=Host(`${SUBDOMAIN:-dichtbij3d-tst}.clovercloud.cc`)"
      - "traefik.http.routers.${SUBDOMAIN:-dichtbij3d-tst}.entrypoints=websecure"
      - "traefik.http.services.${SUBDOMAIN:-dichtbij3d-tst}.loadbalancer.server.port=80"

volumes:
  pgdata:
  miniodata:

networks:
  dichtbij3d:
    driver: bridge
  proxy:
    external: true
